# Run 3's drivers as a config (2026-10-15, the plan "all logic in Bend", Phase 4b).  Run 3
# (2026-10-12..13) ran them as untracked scripts: run/v3/run3/boot-guard.sh, s2-driver.sh,
# move.sh and act-restart.sh.  With these values bend-ops does what they did; TEMPLATE.cfg
# says what each key does.  From the repository root:
#   bend-ops guard tools/runs/run3.cfg           after a boot (ft-run3-guard.service: `... install`)
#   bend-ops handover tools/runs/run3.cfg        S1 -> S2 at the boundary (unit ft-v3-s2)
#   bend-ops move tools/runs/run3.cfg STEP       old-stop, old-pull, resume, watch, act, old-check

# The box: vast 55567872 from the move on (2026-10-12 08:40 UTC-6; 55552041 before it)
host root@154.12.38.116
port 21869
instance 55567872

# Here: the chain's DEST and STAGES, and the bend-ops the units run (a gcroot of the wrapper:
# `nix build .#bend-ops -o run/gcroot-bend-ops`)
dest run/v3/run3
stages run/v3/run3.stages
ops run/gcroot-bend-ops/bin/bend-ops

# The units boot-guard.sh kept up (it restarted all three with MemoryMax=2G and OOMPolicy=continue;
# the scripts appended their output with `>> FILE 2>&1`)
unit chain ft-fp-chain-v3 2G run/v3/run3/fp-chain.out
unit watch ft-credit-watch-v3 2G run/v3/run3/credit-watch.out
unit handover ft-v3-s2 2G run/v3/run3/s2-driver.out
guard-unit ft-run3-guard

# The trainer's directory on the box and S1's log there (the act workspace is act-ws)
trainer-dir /root/formalTransformer
trainer-log train.log
box-driver ./bend-box

# The hand-over (s2-driver.sh): S1 ran STEPS=36696 (segment 486's start); polled every 120 s
boundary 36696
handover-poll 120
# act round 1 (started by hand with act-box.sh act, 06:50; resumed by act-restart.sh after the move)
act-ws /home/hhefesto/src/ana
act-dir run/v3/act/r1
act-ckpt run/v2/run2/out/v2-step40000.checkpoint
act-proc bend-corpus-v2
act-stop-wait 15
act-calls 4
act-cap 2
# s2-driver.sh neither started nor pulled the round
act-ensure no
act-pull no
# act-restart.sh started it with PROCS=21 THREADS=2 (the box's cpu.max, 46 cores, less 4, by 2)
act-env PROCS=21 THREADS=2
# S2 (s2.sh with its defaults: FILLER run/v3/s2fill, LR 3e-4, WARM 300, SHARD 250, JOBS 8)
s2-from run/v3/S1
s2-out run/v3/S2
s2-log run/v3/s2.log
s2-every 5000
s2-stage s2

# The move (move.sh, 2026-10-12): vast 55552041 reached its contract's end at 09:50 UTC-6
old-host root@192.234.50.233
old-port 8531
old-instance 55552041
move-name s1
move-step 4000
move-to 36696
move-plan run/v3/S1/plan-fp100m-b16-windows.tsv
move-run run/v3/S1
move-shard fp100m
# the plan, and the shard past the one step 4000 reads; the push log (fp-stage.sh's bend-push) past it
move-need run/v3/S1/plan-fp100m-b16-windows.tsv run/v3/S1/shard-70-fp100m.corpus
move-pushed run/v3/run3/stage2.log 71
move-gate gate.out
move-save 1000
move-trainers traind
# the local ssh that started act round 1 (act-box.sh act never returned)
stop-units ft-v3-act1
