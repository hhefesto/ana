# Run 5 on R5g (2026-11-12; the plan: tools/runs/RUN5.md, R5g: run/v9/run5g.sh).  One stage: r5g hot-starts from
# R5d's r5-step90000 on run/v9/R5g (R5f's plan in form 2: no copies, cap 4 a unit).  The `end` in run/v9/run5g.stages
# makes the chain score, pull and destroy as soon as r5g is done.  TEMPLATE.cfg says what each key does.  From the
# repository root:
#   bend-ops guard tools/runs/run5g.cfg install    once, after r5g has started
#   bend-ops guard tools/runs/run5g.cfg            the units (chain, watch) unless active

# The box: vast 60444274, RTX 5090, California, $0.656/h with 100 GB (rented 11-12 21:37).  Vast's ssh relay, not the
# public IP, which changed under R5d's chain on 11-10.
host root@ssh2.vast.ai
port 35028
instance 60444274

# Here
dest run/v9/run5g
stages run/v9/run5g.stages
ops run/gcroot-bend-ops/bin/bend-ops

unit chain ft-fp-chain-v5g 2G run/v9/run5g/chain.out
unit watch ft-credit-watch-v5g 2G run/v9/run5g/credit-watch.out
guard-unit ft-run5g-guard
# r5g is `bend-box again ... r5g`: its log is r5g.log, not train.log
env LOG0=r5g.log

# The trainer on the box
trainer-dir /root/ana
trainer-log r5g.log
box-driver ./bend-box
# no hand-over: r5g is the only stage
s2-stage r5g
