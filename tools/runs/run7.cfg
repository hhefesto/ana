# Run 7 on R7 (2026-11-15; docs/r7/PLAN.md).  The user, 11-15: "be ready to train on my approval": nothing here
# rents.  One stage: r7 hot-starts from run/v9/run7go.sh's checkpoint C on run/v9/R7, its validation readings on
# R7's fixed validation set (VALID_CORPUS, run/v9/R7valid).  The `end` in run/v9/run7.stages makes the chain score,
# pull and destroy as soon as r7 is done.  TEMPLATE.cfg says what each key does.  run/v9/run7go.sh fills in the box
# and runs, from the repository root:
#   bend-ops guard tools/runs/run7.cfg install    once, after r7 has started
#   bend-ops guard tools/runs/run7.cfg            the units (chain, watch) unless active

# The box: filled in by run/v9/run7go.sh when it rents.  Vast's ssh relay, not the public IP.
host root@HOST
port 22
instance 00000000

# Here
dest run/v9/run7
stages run/v9/run7.stages
ops run/gcroot-bend-ops/bin/bend-ops

unit chain ft-fp-chain-v7 2G run/v9/run7/chain.out
unit watch ft-credit-watch-v7 2G run/v9/run7/credit-watch.out
guard-unit ft-run7-guard
# r7 is `bend-box again ... r7`: its log is r7.log, not train.log
env LOG0=r7.log

# The trainer on the box
trainer-dir /root/ana
trainer-log r7.log
box-driver ./bend-box
# no hand-over: r7 is the only stage
s2-stage r7
