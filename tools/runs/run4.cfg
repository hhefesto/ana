# Run 4's drivers (2026-10-15; the plan: HANDOFF.md "Run 4").  C1 hot-starts from run 3's final
# checkpoint on run/v4/R4 (the unused raw, tools/runs/run4-build.txt) to the boundary; the act
# round runs beside it with run 3's final as its policy; at the boundary the hand-over builds C2
# (the capped rest with the round's episodes, twice) and CTL (the same rest alone, from C1's
# boundary save) on the box and appends both.  TEMPLATE.cfg says what each key does.  From the
# repository root:
#   bend-ops guard tools/runs/run4.cfg install    once, after C1 has started
#   bend-ops guard tools/runs/run4.cfg            the units (chain, watch, hand-over) unless active

# The box: vast 56197173, RTX 5090, Texas, 128 cores (a cgroup v1 quota of 122.9), 125 GB,
# $0.80/h, rented 2026-10-15 22:01 UTC-6 (contract to 2026-11-21)
host root@104.188.171.133
port 11630
instance 56197173

# Here
dest run/v4/run4
stages run/v4/run4.stages
ops run/gcroot-bend-ops/bin/bend-ops

unit chain ft-fp-chain-v4 2G run/v4/run4/chain.out
unit watch ft-credit-watch-v4 2G run/v4/run4/credit-watch.out
unit handover ft-v4-handover 2G run/v4/run4/handover.out
guard-unit ft-run4-guard
# C1 is `bend-box again ... c1`: its log is c1.log, not train.log
env LOG0=c1.log

# The trainer on the box
trainer-dir /root/formalTransformer
trainer-log c1.log
box-driver ./bend-box

# The hand-over.  C1 was started from s2-step56725 (global step 56725) with TRAIN_STEPS=BOUNDARY,
# NLR=1e-4 and NWARM=300, so its log says `done at step 56725+BOUNDARY`; BOUNDARY is the plan's
# own step: segment 209's start in run/v4/R4's plan (24,927 steps), where lr.at(1e-4, B, 300, 24927)
# is 5.99e-5; C1 is done at global step 67769, its last save out/c1-step67769.checkpoint (CTL's from).
boundary 11044
plan-base 56725
handover-poll 120
act-ws /home/hhefesto/src/ana
act-dir run/v4/act/r1
# run 3's final (pushed by `bend-ops act ckpt` before C1 starts; C1's TRAIN_INIT is the same file)
act-ckpt run/v3/run3/out/s2-step56725.checkpoint
act-ensure yes
act-pull yes
# the box's quota is cgroup v1 (cpu.cfs_quota_us 12287999: 122.9 cores), which `act` does not read
# (cpu.max only): 56 x 2 threads leaves about ten cores to the trainer, the hand-over and the system
act-env PROCS=56 THREADS=2
s2-from run/v4/R4
s2-out run/v4/C2
s2-log run/v4/s2.log
s2-every 5000
s2-stage c2
s2-env FILLER=run/v3/s2fill LR=1e-4 WARM=300 SHARD=250 JOBS=8
s2-env REST_STEPS=4000
# the round's episodes twice (two epochs).  The second copy is r1e2: r1's accepted transcripts with /e2 after
# each id, made on the box by hand on 2026-10-16, because mix-corpus refuses an id twice (r1 named
# twice failed s2 at 06:28 with "duplicate ids across sources")
s2-acts run/v4/act/r1 run/v4/act/r1e2
ctl-stage ctl
ctl-out run/v4/CTL
ctl-every 5000
