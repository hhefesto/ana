# Run 8 on R8 (2026-11-17; docs/r8/PLAN.md).  The user, 11-17: "Fix and prompt me when ready to train": nothing here
# rents.  One stage: r8 hot-starts from run/v9/run8go.sh's checkpoint C on run/v9/R8, its validation readings on
# R8's fixed validation set (VALID_CORPUS, run/v9/R8valid).  The `end` in run/v9/run8.stages makes the chain score,
# pull and destroy as soon as r8 is done.  TEMPLATE.cfg says what each key does.  run/v9/run8go.sh fills in the box
# and runs, from the repository root:
#   bend-ops guard tools/runs/run8.cfg install    once, after r8 has started
#   bend-ops guard tools/runs/run8.cfg            the units (chain, watch) unless active

# The box: filled in by run/v9/run8go.sh when it rents.  Vast's ssh relay, not the public IP.
host root@HOST
port 22
instance 00000000

# Here
dest run/v9/run8
stages run/v9/run8.stages
ops run/gcroot-bend-ops/bin/bend-ops

unit chain ft-fp-chain-v8 2G run/v9/run8/chain.out
unit watch ft-credit-watch-v8 2G run/v9/run8/credit-watch.out
guard-unit ft-run8-guard
# r8 is `bend-box again ... r8`: its log is r8.log, not train.log
env LOG0=r8.log

# The trainer on the box
trainer-dir /root/ana
trainer-log r8.log
box-driver ./bend-box
# no hand-over: r8 is the only stage
s2-stage r8
