# A run's drivers as one tracked config (2026-10-15, the plan "all logic in Bend", Phase 4b):
# copy this to tools/runs/runN.cfg, fill in the box and the run, and use it from the
# repository root instead of writing new scripts.  run3.cfg is run 3's.
#
#   bend-ops guard CFG install      once: the persistent user unit (guard-unit) that runs
#                                   `bend-ops guard CFG` 60 s after every boot
#   bend-ops guard CFG              the units below started unless active (also by hand)
#   bend-ops handover CFG           the S1 -> S2 hand-over (normally its unit, started by the guard)
#   bend-ops move CFG STEP          a move to another box, step by step (see the move keys)
#   bend-ops unit list | restart NAME   the recorded units (UNIT_STATE)
#
# A setting a line: the key, then its words (# comments and blank lines skipped).  A key given
# twice: the last line wins, except env, act-env, s2-env, stop-units and move-need (every line's
# words) and unit (one line a role).  Paths "here" are relative to the repository root; paths
# on the box are absolute or relative to trainer-dir.  Defaults in [brackets].

# --- The box (after a move: the new one) -------------------------------------------------------
host root@HOST                      # ssh user@host (SSH_OPTS, SSH_TRIES, ... from the environment)
port 22
instance 00000000                   # the vast instance the chain destroys

# --- Here ---------------------------------------------------------------------------------------
dest run/vN/runN                    # the chain's DEST: chain.log, the markers, out/
stages run/vN/runN.stages           # the chain's STAGES (the hand-over appends to it)
ops run/gcroot-bend-ops/bin/bend-ops   # what the units run [this bend-ops]; keep a gcroot:
                                       #   nix build .#bend-ops -o run/gcroot-bend-ops

# --- Units: `unit ROLE NAME [MEMORYMAX [OUTPUT]]` -----------------------------------------------
# ROLE chain:    bend-ops chain HOST PORT INSTANCE DEST STAGES
# ROLE watch:    bend-ops watch HOST PORT DEST [watch-min]
# ROLE handover: bend-ops handover CFG (the guard starts it until STAGES has s2-stage)
# MEMORYMAX [4G] is a generous cap, not a throttle; OUTPUT gets stdout and stderr appended.
# Each is started by `systemd-run --user` with its line recorded (bend-ops unit), so the guard
# or `bend-ops unit restart NAME` puts it back after a reboot.
unit chain ft-fp-chain-vN 2G run/vN/runN/chain.out
unit watch ft-credit-watch-vN 2G run/vN/runN/credit-watch.out
unit handover ft-vN-s2 2G run/vN/runN/handover.out
guard-unit ft-runN-guard            # the persistent unit's name (guard install)
# watch-min 1.00                    # the watch's MIN in dollars [its own default, 1.00]
# env POLL=120                      # environment for every unit (systemd-run --setenv), K=V words

# --- The trainer on the box ---------------------------------------------------------------------
trainer-dir /root/formalTransformer # absolute: the hand-over's commands run from the act workspace
trainer-log train.log               # the first stage's log [train.log]
box-driver ./bend-box               # bend-box there [./bend-box] (stage box builds it)

# --- The hand-over (bend-ops handover) ----------------------------------------------------------
boundary 36696                      # S1 runs STEPS=BOUNDARY; the hand-over waits for `done at step B`
handover-poll 120                   # seconds between looks [120]
act-ws /home/hhefesto/src/formalTransformer   # the act workspace, the same path here and on the box
act-dir run/vN/act/r1               # the act round, in act-ws
act-ckpt run/v2/run2/out/v2-step40000.checkpoint   # the checkpoint the round acts with (act ensure)
# act-home /home/hhefesto           # HOME for the box's checkers [$HOME]
# act-box-bin /usr/local/bin        # the box's static nix [/usr/local/bin]
# act-deploy run/v2/gcroot-deploy-agent/bin/deploy          # [that] corpus-v2 agent-act, s2
# act-episode run/agent/gcroot-bend-episode/bin/bend-episode # [that] accept, fixed
# act-proc bend-corpus-v2           # what act-stop stops (its session) [bend-corpus-v2]
# act-stop-wait 15                  # seconds between TERM and KILL [15]
# act-calls 4                       # bend-episode accept/fixed CALLS [4]
# act-cap 2                         # and CAP [2]
act-ensure yes                      # yes: `bend-ops act ensure` before the wait (setup, the
                                    # checkpoint, the round started unless one runs) [no]
act-pull yes                        # yes: `bend-ops act pull` after the append, so the round's
                                    # episodes are kept here [no]
# act-env PROCS=21 THREADS=2        # environment for act ensure/pull (PROCS: else from cpu.max)
s2-from run/vN/S1                   # S1's plan directory, under trainer-dir
s2-out run/vN/S2                    # where S2 is built, under trainer-dir (STAGES gets it relative)
s2-log run/vN/s2.log                # s2's output, in act-ws [run/v3/s2.log]
s2-every 5000                       # the stage's EVERY (pulls) [5000]
s2-stage s2                         # the stage's name in STAGES [s2]
# s2-env FILLER=run/v3/s2fill LR=3e-4 WARM=300 SHARD=250 JOBS=8   # bend-corpus-v2 s2's settings

# --- A move (bend-ops move CFG STEP), filled in when one is needed -------------------------------
# Edit host/port/instance to the new box and these to the old one, then run in order:
#   old-stop, old-pull, [restage,] resume, watch, act, old-check; destroy the old box by hand.
# old-host root@OLDHOST
# old-port 22
# old-instance 00000000
# move-name s1                      # the stage the move interrupts
# move-step 4000                    # the save it resumes from (its log must say it was saved)
# move-to 36696                     # the step it runs to [boundary]
# move-plan run/vN/S1/plan-fp100m-b16-windows.tsv   # the stage's plan, run dir, shard size
# move-run run/vN/S1
# move-shard fp100m
# move-need run/vN/S1/plan-fp100m-b16-windows.tsv run/vN/S1/shard-70-fp100m.corpus   # on the new box
# move-pushed run/vN/runN/stage2.log 71   # stage box's push log here, past this shard
# move-gate gate.log                # the new box's G2 verdict file [gate.log]
# move-save 1000                    # SAVE for the resumed trainer [1000]
# move-trainers traind traind-next  # the trainers old-stop kills [traind traind-next]
# move-restage                      # STAGEs for `restage` (stage restage's stage push) []
# stop-units                        # more local units old-stop stops (with chain and watch)
