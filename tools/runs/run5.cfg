# Run 5's drivers (2026-11-03; the plan: tools/runs/RUN5.md).  One stage: r5 hot-starts from run 4's
# final checkpoint c2-step72491 on run/v6/R5 (every language's sessions in the mugen shape,
# tools/runs/run5-build.txt).  The `end` in run/v6/run5.stages makes the chain score, pull and destroy
# as soon as r5 is done.  TEMPLATE.cfg says what each key does.  From the repository root:
#   bend-ops guard tools/runs/run5.cfg install    once, after r5 has started
#   bend-ops guard tools/runs/run5.cfg            the units (chain, watch) unless active

# The box: FILL IN when rented (RUN5.md, step 2)
host root@HOST
port 22
instance 00000000

# Here
dest run/v6/run5
stages run/v6/run5.stages
ops run/gcroot-bend-ops/bin/bend-ops

unit chain ft-fp-chain-v5 2G run/v6/run5/chain.out
unit watch ft-credit-watch-v5 2G run/v6/run5/credit-watch.out
guard-unit ft-run5-guard
# r5 is `bend-box again ... r5`: its log is r5.log, not train.log
env LOG0=r5.log
# EXTRA_EVAL stays empty: the chain scores every pulled save on transcript-fp and transcript-next;
# the mugen-shape corpora (v2-mugen.corpus, v2-mugen-bend.corpus) are scored by RUN5.md's step 6

# The trainer on the box
trainer-dir /root/ana
trainer-log r5.log
box-driver ./bend-box
# no hand-over: r5 is the only stage
s2-stage r5
