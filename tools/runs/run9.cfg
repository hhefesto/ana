# Run 9 on R9 (2026-11-18; docs/r9/PLAN.md section 4: R8 with R9's changes; as run8.cfg).  The user, 11-17: "Fix and prompt me when ready to train": nothing here
# rents.  One stage: r9 hot-starts from run/v9/run9go.sh's checkpoint C on run/v9/R9, its validation readings on
# R8's fixed validation set (VALID_CORPUS, run/v9/R8valid).  The `end` in run/v9/run9.stages makes the chain score,
# pull and destroy as soon as r9 is done.  TEMPLATE.cfg says what each key does.  run/v9/run9go.sh fills in the box
# and runs, from the repository root:
#   bend-ops guard tools/runs/run9.cfg install    once, after r9 has started
#   bend-ops guard tools/runs/run9.cfg            the units (chain, watch) unless active

# The box: filled in by run/v9/run9go.sh when it rents.  Vast's ssh relay, not the public IP.
host root@HOST
port 22
instance 00000000

# Here
dest run/v9/run9
stages run/v9/run9.stages
ops run/gcroot-bend-ops/bin/bend-ops

unit chain ft-fp-chain-v9 2G run/v9/run9/chain.out
unit watch ft-credit-watch-v9 2G run/v9/run9/credit-watch.out
guard-unit ft-run9-guard
# r9 is `bend-box again ... r9`: its log is r9.log, not train.log
env LOG0=r9.log

# The trainer on the box
trainer-dir /root/ana
trainer-log r9.log
box-driver ./bend-box
# no hand-over: r9 is the only stage
s2-stage r9
