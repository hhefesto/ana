# Run 6 on R6 (2026-11-13; the user, 11-13 23:xx: "May I rent the RTX 5090 and start training as soon as R6 is
# ready (around 04:00), without waiting for you?" Yes).  One stage: r6 hot-starts from R5g's last save,
# r5g-step106500 (the user 11-14: "r5g-step106500, R5g's last checkpoint"; the first start, from r5-step90000,
# was stopped) on run/v9/R6 (R5g's plan with form 2's kinds: docs/form2/KINDS.md).  The `end` in
# run/v9/run6.stages makes the chain score, pull and destroy as soon as r6 is done.  TEMPLATE.cfg says what each key
# does.  run/v9/run6go.sh fills in the box and runs, from the repository root:
#   bend-ops guard tools/runs/run6.cfg install    once, after r6 has started
#   bend-ops guard tools/runs/run6.cfg            the units (chain, watch) unless active

# The box: filled in by run/v9/run6go.sh when it rents.  Vast's ssh relay, not the public IP, which changed under
# R5d's chain on 11-10.
host root@ssh6.vast.ai
port 38838
instance 60621379

# Here
dest run/v9/run6
stages run/v9/run6.stages
ops run/gcroot-bend-ops/bin/bend-ops

unit chain ft-fp-chain-v6 2G run/v9/run6/chain.out
unit watch ft-credit-watch-v6 2G run/v9/run6/credit-watch.out
guard-unit ft-run6-guard
# r6 is `bend-box again ... r6`: its log is r6.log, not train.log
env LOG0=r6.log

# The trainer on the box
trainer-dir /root/ana
trainer-log r6.log
box-driver ./bend-box
# no hand-over: r6 is the only stage
s2-stage r6
