# Run 6's new Bend code (2026-10-28):
#
#   bend-corpus-v2 collect tools/corpus-v2/collect/bend-run6.cfg all
#
# from the repository root.  Run 5's config with:
#   - BendHub again (`hub`): its listing had 991 package versions on 10-28 (634 on 10-16), 475
#     names; a name run 5 took is a repository the corpus holds (only its new paths are new, and
#     it is never a vault candidate), the 104 new names are new repositories;
#   - growth of every repository run 5 took (its 40 `repo` and 97 `growth` lines, at their rules);
#   - the Bend 2 repositories the 2026-10-28 GitHub survey found that no collection holds
#     (code search `extension:bend`, bisected by size: 41,113 files in 385 repositories; each
#     unknown repository's first, middle and last .bend file sampled and marked Bend 2 by
#     `import Base`/`.bend` imports, `0n` literals, typed arrows, `is`, proofs, `&2`), as
#     `repo ... all` (87 repositories);
#   - the survey's Bend 2 repositories whose ids the corpus holds (runs 1-2's raw-new and raw)
#     but no PINS file names, never grown since: `growth ... all` (75; aricarmo/godot-bend
#     without godot/api/, generated by its tools/gen_api.py);
#   - the upstream's .bend files added or changed since run 5's pin (234cb9b9);
#   - the loader is the flake's Bend 2.0.39 (BEND_NO_TELEMETRY=1), the corpus run 5's outputs,
#     its port and pool 5b besides runs 2-4's; vault-known and big-known add run 5's.
# Left out as in run 5 (Bend 1 repositories, compiler output, copies, submodule-only trees), and
# the survey's 61 Bend 1 repositories and 45 with no Bend marker (OpenFOAM, LaTeX, HVM, ...);
# github-linguist/linguist and amrierscuo/github-linguist-hello-world-corpus (samples copied from
# other repositories).

out run/v6/collect/bend
src run/v6/collect/src/bend
lang bend
pins run/v6/collect/src/PINS.tsv
# run 3's and run 4's pins (run 4's last): a growth repository still at its pin has nothing new
known run/v2/raw-new3/src/PINS.tsv run/v4/collect/src/PINS.tsv run/v5/collect/src/PINS.tsv
bend2 /home/hhefesto/src/bend2
# from run 4's pin to origin/main after a fetch (the pin then goes into PINS.tsv)
upstream bendlang/bend 234cb9b950800f20b15feafcb4ce2f43e76e7fae

# the locked compiler (run/gcroot-bend; the `bend` on PATH is another version)
loader /home/hhefesto/src/ana/run/v5/gcroot-bend-2.0.39/bin/bend
loader-secs 60
# the 7,742 listed files whose text is a corpus file's (sha256, every corpus line's .jsonl): pre
# drops them whatever the loader says, so their verdict is recorded, not run (10-28)
verdicts run/v6/collect/corpus-copies.check.tsv
procs 4
order bytes
big 1000000
vault quarter
vault-min 3
# run 3's and run 4's vaults (growth there stays there; v2's Bend vault is the same 9) and the
# directory-split repositories: run 3's, run 4's, and the two curated ones v2's holdout split by
# directory (over 300 paths: Giulio2002/bend-collections 1,421, dearlordylord/b 381)
vault-known run/v2/raw-new3/vault/repos.txt run/v4/collect/bend/vault/repos.txt run/v5/collect/bend/vault/repos.txt
big-known run/v2/raw-new3/stage/pre/big.repos run/v4/collect/bend/stage/pre/big.repos tools/corpus-v2/collect/bend-run5.big-known run/v5/collect/bend/stage/pre/big.repos

streams run/v2/holdout/stream-index.json
# a copy of run 4's (the keys of its corpus files, by their size and mtime)
keycache run/v6/collect/keycache
# run 4's corpus, then run 4's Bend outputs
corpus run/v2/raw/lean.jsonl run/v2/raw/agda.jsonl run/v2/raw/bend.jsonl run/v2/raw-hf/lean.jsonl
corpus run/v2/raw-stack/lean.jsonl run/v2/raw-stack/agda.jsonl run/v2/vault/lean.jsonl run/v2/vault/agda.jsonl
corpus run/v2/transcripts/lean/files-hi.nul run/v2/transcripts/lean/files-lo.nul run/v2/transcripts/agda/files-hi.nul
corpus run/v2/transcripts/agda/files-lo.nul run/v2/transcripts/bend/files-hi.nul run/v2/transcripts/bend/files-lo.nul
corpus run/raw-new/bend.jsonl
corpus run/v2/raw-new3/bend.jsonl run/v2/raw-new3/vault/bend.jsonl run/v2/raw-new3/holdout/bend.jsonl
corpus run/v4/collect/bend/bend.jsonl run/v4/collect/bend/vault/bend.jsonl
corpus run/v5/collect/bend/bend.jsonl run/v5/collect/bend/vault/bend.jsonl run/v5/collect/bend/holdout/bend.jsonl
corpus run/v5/port/bend.jsonl run/v5/ratio/raw/bend-run5b.jsonl

