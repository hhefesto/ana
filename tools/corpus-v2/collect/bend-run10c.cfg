# everything has been deployed and laws added, add the edgar repo to ana's training corpus").  Its HEAD at the
# collection: the solver, the camera, the colour schemes, LAWS.bend, PROOF.bend (--verdict: ALL PROOFS CHECK) and
# FIT.bend (the kernel's out of fuel there; Bend's checker: ALL PROOFS CHECK).
#
#   bend-corpus-v2 collect tools/corpus-v2/collect/bend-run10c.cfg all
