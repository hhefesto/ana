# Run 4's new Bend code (2026-10-14, the plan's Phase 2):
#
#   bend-corpus-v2 collect tools/corpus-v2/collect/bend-run4.cfg all
#
# from the repository root.  The 19 Bend 2 repositories the 2026-10-14 survey found, the
# upstream's .bend files added or changed since run 3's pin, and the growth of the 43
# repositories run 3 took (only paths the corpus never had, routed by their run-3
# assignment).  Run 2's Bend repositories (run/v2/raw/bend.jsonl) are not here: their ids
# are `repo:OWNER/NAME/PATH` (folded to the owner, so neither their paths nor their units
# meet this tool's OWNER__NAME ids) and only 6 of their 33 clones kept a commit.

out run/v4/collect/bend
src run/v4/collect/src/bend
lang bend
pins run/v4/collect/src/PINS.tsv
# run 3's pins: a growth repository still at its run-3 commit has nothing new
known run/v2/raw-new3/src/PINS.tsv
bend2 /home/hhefesto/src/bend2
# from run 3's pin to origin/main after a fetch (the pin then goes into PINS.tsv)
upstream bendlang/bend 1d895ca09d0b5d9d4d9e8de23d760f9393d813f8

# the loader run 3 used: Bend 2.0.35, the fork
loader /nix/store/ng8wkfcdxpkfijm0igiggjlk2l88nk1s-bend/bin/bend
loader-secs 60
procs 4
order bytes
big 1000000
vault quarter
vault-min 3
# run 3's vault (growth there stays there) and its directory-split repositories (frozen)
vault-known run/v2/raw-new3/vault/repos.txt
big-known run/v2/raw-new3/stage/pre/big.repos

streams run/v2/holdout/stream-index.json
keycache run/v4/collect/keycache
# raw-new3's CORPUS_FILES, then run 3's Bend outputs
corpus run/v2/raw/lean.jsonl run/v2/raw/agda.jsonl run/v2/raw/bend.jsonl run/v2/raw-hf/lean.jsonl
corpus run/v2/raw-stack/lean.jsonl run/v2/raw-stack/agda.jsonl run/v2/vault/lean.jsonl run/v2/vault/agda.jsonl
corpus run/v2/transcripts/lean/files-hi.nul run/v2/transcripts/lean/files-lo.nul run/v2/transcripts/agda/files-hi.nul
corpus run/v2/transcripts/agda/files-lo.nul run/v2/transcripts/bend/files-hi.nul run/v2/transcripts/bend/files-lo.nul
corpus run/raw-new/bend.jsonl
corpus run/v2/raw-new3/bend.jsonl run/v2/raw-new3/vault/bend.jsonl run/v2/raw-new3/holdout/bend.jsonl

# the 2026-10-14 survey's new Bend 2 repositories
