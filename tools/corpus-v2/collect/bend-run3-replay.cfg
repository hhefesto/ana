# Run 3's Bend inputs (tools/corpus-v2/raw-new3.sh, 2026-10-07), replayed by the Bend tool:
#
#   bend-corpus-v2 collect tools/corpus-v2/collect/bend-run3-replay.cfg list gate-bend nul keys pre gate split check
#
# from the repository root, without `fetch`: the pinned clones are run 3's own
# (run/v2/raw-new3/src/bend, read only; PINS.tsv names every commit), and the outputs
# must equal run/v2/raw-new3/{bend.jsonl,vault/bend.jsonl,holdout/bend.jsonl} and the Bend
# rows of its stage files byte for byte (bend/CorpusV2/Collect.bend's header says where
# the tool and the script part).

out run/v4/collect-replay
src run/v2/raw-new3/src/bend
lang bend
pins run/v2/raw-new3/src/PINS.tsv
bend2 /home/hhefesto/src/bend2
# .bend files added or changed upstream from a3f1782a to the pin PINS.tsv holds (1d895ca0)
upstream bendlang/bend a3f1782a

# run 3's loader: Bend 2.0.35, the fork (`command -v bend` on 2026-10-07)
loader /nix/store/ng8wkfcdxpkfijm0igiggjlk2l88nk1s-bend/bin/bend
loader-secs 60
# run 3's 81 timeouts as it recorded them: a timeout is the clock's verdict (run 3 ran 14
# loaders at once; on 2026-10-14, 4 at once, 56 of them finished: 41 pass, 10 checked,
# 5 load), every other file goes to the loader again (all 3,261 reproduced run 3's verdict)
verdicts run/v2/raw-new3/stage/bend.check.tsv timeout
procs 4
# run 3 listed each repository in find's order (this filesystem's), not sorted
order find
big 1000000
vault quarter
vault-min 3

streams run/v2/holdout/stream-index.json
keycache run/v4/collect/keycache
# raw-new3's CORPUS_FILES, in its order
corpus run/v2/raw/lean.jsonl run/v2/raw/agda.jsonl run/v2/raw/bend.jsonl run/v2/raw-hf/lean.jsonl
corpus run/v2/raw-stack/lean.jsonl run/v2/raw-stack/agda.jsonl run/v2/vault/lean.jsonl run/v2/vault/agda.jsonl
corpus run/v2/transcripts/lean/files-hi.nul run/v2/transcripts/lean/files-lo.nul run/v2/transcripts/agda/files-hi.nul
corpus run/v2/transcripts/agda/files-lo.nul run/v2/transcripts/bend/files-hi.nul run/v2/transcripts/bend/files-lo.nul
corpus run/raw-new/bend.jsonl

