# Run 5's new Bend code (2026-10-16):
#
#   bend-corpus-v2 collect tools/corpus-v2/collect/bend-run5.cfg all
#
# from the repository root.  Three sources:
#   - BendHub (the `hub` line, new for run 5): the newest version of every package name
#     and every unnamed package, each a new repository hub__NAME (hub__0xHASH); the
#     licences in PINS (MIT-0 (default) for a package without a LICENSE: the hub's terms);
#   - the Bend 2 repositories the 2026-10-16 GitHub survey found that no collection holds
#     (`repo`), generated and compiler-output directories excluded;
#   - the growth of every repository run 4 took (its 19 new and its 43 growth lines, at
#     run 4's rules) and of the curated repositories pushed to since their collection, and
#     the upstream's .bend files added or changed since run 4's pin.
# Left out: HigherOrderCO/Bend1 and the other Bend 1 repositories the search found (ericfode/limn,
# fibonatto/bend-lang-utils and functions-tests among them: another language); hhefesto/ana (the
# user's own: its bend/ is in the corpus as own code); HigherOrderCO-archive/kind2-archive (no
# Bend); i574n/spiral (all 388 files are compiler output, apps/compiler/tmp/samples);
# aivv73/bend-vulkan (31 of its 33 files import its git submodules, which fetch does not clone);
# Alexis315/beads_bend (a copy of Dicklesworthstone/beads_bend); the curated
# 0x5f3759df-fs/scrapanium and IlyaGulya/bend2-lsp-rs (their new paths are source snapshots and
# generated bench fixtures).
# The vault: a quarter of the eligible new repositories, the hub's packages among them (a
# package is a repository to every step).
#
# The run (2026-10-16, 11:17 to 13:11): 509 repositories (371 hub packages, 40 new, 97 growth of
# which 53 unchanged, the upstream), 12,301 files listed, 8,876 past the loader; out:
# bend.jsonl 2,357 files 24.5 MB, vault/bend.jsonl 676 files 6.6 MB (34 of 133 eligible),
# holdout/bend.jsonl 18 files 0.1 MB; check: no id twice, no corpus path, key or id.

out run/v5/collect/bend
src run/v5/collect/src/bend
lang bend
pins run/v5/collect/src/PINS.tsv
# run 3's and run 4's pins (run 4's last): a growth repository still at its pin has nothing new
known run/v2/raw-new3/src/PINS.tsv run/v4/collect/src/PINS.tsv
bend2 /home/hhefesto/src/bend2
# from run 4's pin to origin/main after a fetch (the pin then goes into PINS.tsv)
upstream bendlang/bend 014ccd03c43270c151f46679075f7f04593077ea

# the locked compiler (run/gcroot-bend; the `bend` on PATH is another version)
loader /home/hhefesto/src/formalTransformer/run/gcroot-bend/bin/bend
loader-secs 60
procs 4
order bytes
big 1000000
vault quarter
vault-min 3
# run 3's and run 4's vaults (growth there stays there; v2's Bend vault is the same 9) and the
# directory-split repositories: run 3's, run 4's, and the two curated ones v2's holdout split by
# directory (over 300 paths: Giulio2002/bend-collections 1,421, dearlordylord/b 381)
vault-known run/v2/raw-new3/vault/repos.txt run/v4/collect/bend/vault/repos.txt
big-known run/v2/raw-new3/stage/pre/big.repos run/v4/collect/bend/stage/pre/big.repos tools/corpus-v2/collect/bend-run5.big-known

streams run/v2/holdout/stream-index.json
# a copy of run 4's (the keys of its corpus files, by their size and mtime)
keycache run/v5/collect/keycache
# run 4's corpus, then run 4's Bend outputs
corpus run/v2/raw/lean.jsonl run/v2/raw/agda.jsonl run/v2/raw/bend.jsonl run/v2/raw-hf/lean.jsonl
corpus run/v2/raw-stack/lean.jsonl run/v2/raw-stack/agda.jsonl run/v2/vault/lean.jsonl run/v2/vault/agda.jsonl
corpus run/v2/transcripts/lean/files-hi.nul run/v2/transcripts/lean/files-lo.nul run/v2/transcripts/agda/files-hi.nul
corpus run/v2/transcripts/agda/files-lo.nul run/v2/transcripts/bend/files-hi.nul run/v2/transcripts/bend/files-lo.nul
corpus run/raw-new/bend.jsonl
corpus run/v2/raw-new3/bend.jsonl run/v2/raw-new3/vault/bend.jsonl run/v2/raw-new3/holdout/bend.jsonl
corpus run/v4/collect/bend/bend.jsonl run/v4/collect/bend/vault/bend.jsonl

# BendHub: every package (the newest of a name, every unnamed one)
hub https://hub.bend-lang.com all

