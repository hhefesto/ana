# Run 5's collection's loader rejects, ported (2026-10-16):
#
#   bend-corpus-v2 port tools/corpus-v2/port/bend-run5.cfg all
#
# from the repository root (bend/CorpusV2/Port.bend says what each step does).  The files:
# run/v5/collect/bend/stage/bend.check.tsv's `load` rows (3,425 files, 62 MB, 137 repositories).

collect run/v5/collect/bend
src run/v5/collect/src/bend
out run/v5/port
inbox run/v5/bend-port/inbox
# run 3's and run 4's vaults (collect's vault-known); run 5's own is collect's vault/repos.txt
vault-known run/v2/raw-new3/vault/repos.txt run/v4/collect/bend/vault/repos.txt

# the locked compiler (run/gcroot-bend: the ft-kernels fork 977a2d98, upstream d2aeefc1) and its
# Base (the source its wrapper runs: `exec bun .../bend2/main.ts`)
loader /home/hhefesto/src/formalTransformer/run/gcroot-bend/bin/bend
base /nix/store/dbp4j1kqyji90sn6k7bc6yfx435vvs3m-source/bend2/base.bend
# upstream's tag v2.0.37 (4ff8545f), run by Bun as the fork is (run/v5/port/gcroot-bend-v2_0_37)
base-old /nix/store/sv9jwvkyc9dl7p1kk5n0ms0jrm7ifvky-v2_0_37/bend2/base.bend
loader-secs 60
procs 4

# upstream main (234cb9b9, 2026-10-16) and the tags before it (v2.0.26: the last before names
# became words joined by dots and every clash a refusal), each run by Bun from its source
# tree (run/v5/port/gcroot-bend-*): the first that loads an original gives the author's failures
