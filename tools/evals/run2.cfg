# Run 2's evals (2026-10-15: run/v2/evalruns/eval-run2.sh, run2-e1.sh and agent-e5-run2.sh of
# 2026-10-06, as a config of `bend-ops evals`; bend/Box/Evals.bend says what each key does).
#   TAGS=v2-step45000 bend-ops evals tools/evals/run2.cfg
# eval-run2.sh STEP ran E1, the behaviour test, then E5 on one save, once the chain had pulled
# it (`wait`: up to 60 minutes for chain.log's `pulled NAME.checkpoint`).
evals e1 behaviour e5
wait run/v2/run2/chain.log 60

deploy run/v2/gcroot-deploy-agent/bin/deploy
evalset run/v2/evalset/prompts-both.nul
e1-env BEND_FT_THREADS=5 PROCS=3 THREADS=2
e5-env BEND_FT_THREADS=4 TOKENS=160 AGENT_CALLS=4 PROCS=2 THREADS=2

behaviour-deploy nix run .#deploy --
behaviour-dir tools/corpus-v2/behaviour
behaviour-legacy run/v2/evalruns/behaviour/results
behaviour-langs haskell

tag v2-step5000 run/v2/run2/out/v2-step5000.checkpoint run/v2/evalruns
tag v2-step10000 run/v2/run2/out/v2-step10000.checkpoint run/v2/evalruns
# v2-step15000 had E1 and behaviour only (E5 came later): listed, it would run its E5
# tag v2-step15000 run/v2/run2/out/v2-step15000.checkpoint run/v2/evalruns
tag v2-step20000 run/v2/run2/out/v2-step20000.checkpoint run/v2/evalruns
tag v2-step21000 run/v2/run2/out/v2-step21000.checkpoint run/v2/evalruns
tag v2-step35000 run/v2/run2/out/v2-step35000.checkpoint run/v2/evalruns
tag v2-step40000 run/v2/run2/out/v2-step40000.checkpoint run/v2/evalruns
tag v2-step45000 run/v2/run2/out/v2-step45000.checkpoint run/v2/evalruns
tag v2-step50000 run/v2/run2/out/v2-step50000.checkpoint run/v2/evalruns
tag v2-step53880 run/v2/run2/out/v2-step53880.checkpoint run/v2/evalruns

# the low-lr tail (project memory: 40000 -> 53880 lost 10, gained 3)
pair v2-step40000 v2-step53880
pair v2-step20000 v2-step40000
