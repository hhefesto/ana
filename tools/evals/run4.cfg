# Run 4's evals (2026-10-15; HANDOFF.md "Run 4"; bend/Box/Evals.bend says what each key does):
# C1 at the boundary, C2 (the episodes, twice) and CTL (the same rest without them) against each
# other and against run 3's final, s2-step56725, which run 4 continued from.
#   bend-ops evals tools/evals/run4.cfg > run/v4/evalruns/compare.txt
#   TAGS="c1-step67769 s2-step56725" bend-ops evals tools/evals/run4.cfg   (some tags only)
# The success test (the plan): c2 beats ctl and s2-step56725 on E5 (p < 0.05), its retries copy
# the Term before under 85% of the time, and no language falls on E1.
evals behaviour e1 e5

deploy run/v2/gcroot-deploy-agent/bin/deploy
evalset run/v2/evalset/prompts-both.nul
e1-env BEND_FT_THREADS=5 PROCS=3 THREADS=2
e5-env BEND_FT_THREADS=4 TOKENS=160 AGENT_CALLS=4 PROCS=2 THREADS=2

behaviour-deploy nix run .#deploy --
behaviour-dir tools/corpus-v2/behaviour
behaviour-legacy run/v2/evalruns/behaviour/results
behaviour-langs haskell

# tag NAME CHECKPOINT DIR.  C2 ended at 72491 (4,722 steps, episodes 13.3%) and CTL at 71840 (4,071
# steps, the same rest without episodes), both from c1-step67769 (2026-10-16).
tag s2-step56725 run/v3/run3/out/s2-step56725.checkpoint run/v3/evalruns
tag c1-step67769 run/v4/run4/out/c1-step67769.checkpoint run/v4/evalruns
tag c2-step72491 run/v4/run4/out/c2-step72491.checkpoint run/v4/evalruns
tag ctl-step71840 run/v4/run4/out/ctl-step71840.checkpoint run/v4/evalruns

# C1 (new raw at a re-warmed lr) against run 3's final
pair c1-step67769 s2-step56725
# the episodes' effect: C2 against the control (same parent, same rest, same lr)
pair c2-step72491 ctl-step71840
# each end against run 3's final, which run 4 continued from
pair c2-step72491 s2-step56725
pair ctl-step71840 s2-step56725
