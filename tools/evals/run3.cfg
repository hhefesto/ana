# Run 3's evals against run 2's at the same step (2026-10-15: run/v3/evalruns/eval-run3.sh,
# 2026-10-12..14, as a config of `bend-ops evals`; bend/Box/Evals.bend says what each key does).
#   bend-ops evals tools/evals/run3.cfg > run/v3/evalruns/compare.txt
#   TAGS="s2-step56725 v2-step53880" bend-ops evals tools/evals/run3.cfg   (some tags only)
# Cheapest first, so the early answers come early: the behaviour test, then E1 (the 99 doubly
# held-out prompts, greedy, the unit's checker), then E5 (the same prompts through the agent
# loop, 4 calls).
evals behaviour e1 e5

# E1 and E5 as eval-run3.sh ran them (the deploy of 2026-10-07, the agent loop's)
deploy run/v2/gcroot-deploy-agent/bin/deploy
evalset run/v2/evalset/prompts-both.nul
e1-env BEND_FT_THREADS=5 PROCS=3 THREADS=2
e5-env BEND_FT_THREADS=4 TOKENS=160 AGENT_CALLS=4 PROCS=2 THREADS=2

# The behaviour test: Haskell alone, as eval-run3.sh's copy of the harness ran it (its results
# stay in the legacy directory; a new run writes the tracked harness's results/TAG/haskell/)
behaviour-deploy nix run .#deploy --
behaviour-dir tools/corpus-v2/behaviour
behaviour-legacy run/v2/evalruns/behaviour/results
behaviour-langs haskell

# tag NAME CHECKPOINT DIR (DIR/both-NAME is E1's, DIR/agent-NAME E5's)
tag s1-step5000 run/v3/run3/out/s1-step5000.checkpoint run/v3/evalruns
tag v2-step5000 run/v2/run2/out/v2-step5000.checkpoint run/v2/evalruns
tag s1-step10000 run/v3/run3/out/s1-step10000.checkpoint run/v3/evalruns
tag v2-step10000 run/v2/run2/out/v2-step10000.checkpoint run/v2/evalruns
tag s1-step20000 run/v3/run3/out/s1-step20000.checkpoint run/v3/evalruns
tag v2-step20000 run/v2/run2/out/v2-step20000.checkpoint run/v2/evalruns
tag s1-step35000 run/v3/run3/out/s1-step35000.checkpoint run/v3/evalruns
tag v2-step35000 run/v2/run2/out/v2-step35000.checkpoint run/v2/evalruns
tag s2-step40000 run/v3/run3/out/s2-step40000.checkpoint run/v3/evalruns
tag v2-step40000 run/v2/run2/out/v2-step40000.checkpoint run/v2/evalruns
tag s2-step50000 run/v3/run3/out/s2-step50000.checkpoint run/v3/evalruns
tag v2-step50000 run/v2/run2/out/v2-step50000.checkpoint run/v2/evalruns
tag s2-step56725 run/v3/run3/out/s2-step56725.checkpoint run/v3/evalruns
tag v2-step53880 run/v2/run2/out/v2-step53880.checkpoint run/v2/evalruns

# run 3 against run 2 at the same step (run 2 ended at 53880)
pair s1-step5000 v2-step5000
pair s1-step10000 v2-step10000
pair s1-step20000 v2-step20000
pair s1-step35000 v2-step35000
pair s2-step40000 v2-step40000
pair s2-step50000 v2-step50000
pair s2-step56725 v2-step53880
# against run 2's best
pair s2-step56725 v2-step40000
# within run 3
pair s1-step10000 s1-step20000
pair s1-step20000 s2-step40000
pair s2-step40000 s2-step56725
